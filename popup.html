<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Cut the Crap</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        width: 320px;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--rule);
      }

      .name {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: var(--serif);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      .name img {
        width: 20px;
        height: 20px;
      }

      .body {
        padding: 16px 16px 18px;
      }

      .hero {
        display: flex;
        align-items: flex-end;
        gap: 10px;
      }

      .hero-emoji {
        font-size: 26px;
        line-height: 1;
        transform: rotate(-8deg);
      }

      .total {
        font-family: var(--serif);
        font-size: 33px;
        line-height: 1.05;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .total small {
        font-family: var(--sans);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--graphite);
      }

      .paused .total {
        color: var(--graphite);
      }

      .line {
        margin-top: 6px;
        color: var(--graphite);
      }

      .notice {
        font-family: var(--serif);
        font-size: 17px;
        line-height: 1.3;
        font-weight: 700;
      }

      .notice + .line {
        margin-bottom: 14px;
      }

      /* ---- translated / left-as-written meter ---- */

      .meter {
        margin-top: 14px;
      }

      .meter-label {
        display: flex;
        justify-content: space-between;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.02em;
        color: var(--graphite);
        margin-bottom: 4px;
      }

      .meter-track {
        height: 7px;
        border-radius: 5px;
        background: var(--rule);
        overflow: hidden;
      }

      .meter-fill {
        height: 100%;
        border-radius: 5px;
        background: linear-gradient(90deg, var(--pencil-deep), var(--pencil));
        width: 0%;
        transition: width 600ms cubic-bezier(0.25, 0.7, 0.25, 1);
      }

      /* ---- top-kinds bar list ---- */

      .bars {
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px dashed var(--rule);
      }

      .bars-title {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--graphite);
        margin-bottom: 8px;
      }

      .bar-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 6px;
        font-size: 12px;
      }

      .bar-name {
        flex: 0 0 82px;
        color: var(--ink);
      }

      .bar-track {
        flex: 1;
        height: 6px;
        border-radius: 4px;
        background: var(--rule);
        overflow: hidden;
      }

      .bar-fill {
        height: 100%;
        border-radius: 4px;
        background: var(--pencil);
        width: 0%;
        transition: width 600ms cubic-bezier(0.25, 0.7, 0.25, 1);
      }

      .bar-count {
        flex: 0 0 auto;
        min-width: 2ch;
        text-align: right;
        font-family: var(--mono);
        color: var(--graphite);
      }

      /* ---- ad callout ---- */

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 12px;
        padding: 5px 10px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--pencil) 14%, transparent);
        color: var(--pencil-deep);
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.01em;
      }

      /* ---- this-page chips ---- */

      .chips-head {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px dashed var(--rule);
        color: var(--graphite);
        font-size: 12px;
      }

      .chips {
        margin-top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .chip {
        display: inline-flex;
        align-items: baseline;
        gap: 4px;
        padding: 3px 9px;
        border-radius: 999px;
        background: var(--field);
        border: 1px solid var(--rule);
        font-size: 11px;
        color: var(--graphite);
      }

      .chip strong {
        font-family: var(--mono);
        color: var(--ink);
      }

      .foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 16px;
        border-top: 1px solid var(--rule);
        color: var(--graphite);
      }
    </style>
  </head>
  <body>
    <div class="top">
      <span class="name"><img src="icons/icon-32.png" alt="" />Cut the Crap</span>
      <label class="switch" title="Translate long posts on LinkedIn">
        <span id="switch-label">On</span>
        <input id="enabled" type="checkbox" role="switch" checked />
      </label>
    </div>
    <main class="body" id="body" aria-live="polite"></main>
    <div class="foot">
      <a href="options.html" target="_blank" id="settings">Settings</a>
      <span id="saved" class="num"></span>
    </div>
    <script src="popup.js" type="module"></script>
  </body>
</html>
